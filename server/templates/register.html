{% extends "base.html" %}

{% block title %}Register - AdFlow{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg">
                <div class="card-body p-5">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Create Your Account</h2>
                        <p class="text-muted">Join the AdFlow advertising network</p>
                    </div>
                    
                    <!-- Role Selection -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">I want to:</label>
                        <div class="row g-3">
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="role-advertiser" value="advertiser" {% if selected_role == 'advertiser' %}checked{% endif %}>
                                <label class="btn btn-outline-primary w-100 p-3" for="role-advertiser">
                                    <i class="bi bi-megaphone display-6 d-block mb-2"></i>
                                    <strong>Advertise</strong>
                                    <small class="d-block text-muted">Find audiences for my ads</small>
                                </label>
                            </div>
                            <div class="col-6">
                                <input type="radio" class="btn-check" name="role" id="role-publisher" value="publisher" {% if selected_role == 'publisher' %}checked{% endif %}>
                                <label class="btn btn-outline-success w-100 p-3" for="role-publisher">
                                    <i class="bi bi-people display-6 d-block mb-2"></i>
                                    <strong>Publish</strong>
                                    <small class="d-block text-muted">Monetize my traffic</small>
                                </label>
                            </div>
                        </div>
                    </div>
                    
                    <form method="POST" action="/api/v1/auth/register">
                        <input type="hidden" name="role" id="selected-role" value="{{ selected_role or 'advertiser' }}">
                        
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" name="first_name" placeholder="John" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" name="last_name" placeholder="Doe" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Email Address</label>
                            <input type="email" class="form-control" name="email" placeholder="you@example.com" required>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Company Name (Optional)</label>
                            <input type="text" class="form-control" name="company" placeholder="Your Company">
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-control" name="password" placeholder="Create a strong password" required minlength="8">
                            <div class="form-text">Must be at least 8 characters</div>
                        </div>
                        
                        <div class="mb-4">
                            <label class="form-label">Confirm Password</label>
                            <input type="password" class="form-control" name="confirm_password" placeholder="Confirm your password" required>
                        </div>
                        
                        <div class="mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="terms" required>
                                <label class="form-check-label" for="terms">
                                    I agree to the <a href="/terms" class="text-decoration-none">Terms of Service</a> and <a href="/privacy" class="text-decoration-none">Privacy Policy</a>
                                </label>
                            </div>
                        </div>
                        
                        <button type="submit" class="btn btn-adflow w-100 btn-lg">Create Account</button>
                    </form>
                    
                    <div class="text-center mt-4">
                        <p class="text-muted">Already have an account? <a href="/login" class="text-decoration-none fw-bold">Sign in</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
    // Update hidden input when role is selected
    document.querySelectorAll('input[name="role"]').forEach(radio => {
        radio.addEventListener('change', function() {
            document.getElementById('selected-role').value = this.value;
        });
    });
</script>
{% endblock %}
{% endblock %}
